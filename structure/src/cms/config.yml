# The curator's workbench for @@MW_TITLE@@ (Sveltia CMS).
#
# No server: Sveltia reads and writes this repository through GitHub, signed
# in with a personal access token (classic, `repo` scope), kept in that
# browser. Every save is a git commit; CI's model check (npm run
# check:model) refuses anything the museum's rules don't allow. The CMS
# collects; the pipeline validates.
#
# Generated by `mw init` with the universal collections only: records,
# entities, questions, evidence and corrections. Whatever a museum grows
# beyond these, it adds here when it earns it.
#
# Records, and proposals in the corrections queue, are also written by
# `mw pull` and `mw batch`, with IDs claimed from meta/sequences.json. A
# re-run over the same input claims nothing new.
#
# Options written "@set" are filled from the model on every dev start and
# build (scripts/cms-build.ts), so a dropdown shows names and saves IDs.

backend:
  name: github
  repo: @@MW_REPO@@
  branch: main
  auth_methods: [token]
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

publish_mode: editorial_workflow
app_title: "@@MW_TITLE@@ · Curator"

media_folder: public/images/uploads
public_folder: /images/uploads

output:
  omit_empty_optional_fields: true
  json:
    indent_size: 2

collections:
  # ── The corrections queue: text corrections, and the names a machine noticed ──

  - name: corrections
    label: Corrections
    label_singular: Correction
    description: >-
      The queue. A text correction proposes a passage or caption as it should read, whole. A name
      proposal (from `mw pull --propose`) is a name as a span spells it: never an entity. Keep it by
      creating the entity, anchored to the record that spells the name, then accept it; or hold it
      back. Held is a decision, not a deletion. Nothing here reaches the public slice.
    folder: src/data/corrections
    format: json
    extension: json
    identifier_field: id
    slug: { template: "{{fields.id}}", editable: false }
    summary: "{{fields.kind}} · {{fields.target}} · {{fields.status}} · {{fields.proposed_text | truncate(50)}}"
    view_groups:
      - { label: Kind, field: kind }
      - { label: Status, field: status }
    delete: false
    fields:
      - { name: id, label: ID, widget: hidden, default: "c-{{uuid_shorter}}" }
      - name: kind
        label: Kind
        hint: "text: the passage or caption as it should read. name: a name the span spells."
        widget: select
        options: [text, name, contradiction, question, gap, duplicate, link]
        default: text
      - name: target
        label: Span (passage or caption)
        widget: select
        options: "@text"
        hint: The passage (record#passage) or the caption (plate:record) it concerns.
      - name: proposed_text
        label: As it should read, or the name as spelled
        hint: A text correction is the whole passage or caption. A name is spelled exactly as the span spells it.
        widget: text
      - name: cites
        label: Citations (every kind but text and name)
        hint: Words each span holds, quoted exactly. No citation, no acceptance.
        widget: list
        required: false
        summary: "{{fields.span}} · {{fields.quote | truncate(50)}}"
        fields:
          - { name: span, label: Span, widget: select, options: "@text" }
          - { name: quote, label: Quote, widget: text }
      - name: question
        label: The question (question proposals)
        widget: object
        required: false
        collapsed: auto
        fields:
          - { name: text, label: Question, widget: text }
          - { name: record, label: Raised by, widget: select, options: "@records" }
      - name: gap
        label: The gap (gap proposals)
        widget: object
        required: false
        collapsed: auto
        fields:
          - { name: record, label: Record, widget: select, options: "@records" }
          - { name: missing, label: What is missing between, widget: text }
      - name: pair
        label: The two records (duplicate and link proposals)
        widget: object
        required: false
        collapsed: auto
        fields:
          - { name: a, label: One, widget: select, options: "@records" }
          - { name: b, label: The other, widget: select, options: "@records" }
      - name: basis
        label: What they share (link proposals)
        widget: select
        options: [shared name, shared place, shared date]
        required: false
      - name: entity_kind
        label: Name of a (name proposals)
        widget: select
        options: [person, family, place, organization, event]
        required: false
      - { name: reason, label: Why, widget: text }
      - { name: proposed_by, label: Proposed by, widget: hidden, default: "{{author-login}}" }
      - {
          name: date,
          label: Proposed on,
          widget: datetime,
          type: date,
          format: YYYY-MM-DD,
          default: "{{now}}",
        }
      - name: status
        label: Status
        hint: A proposal stays proposed. The curator accepts, applies, rejects or holds it back.
        widget: select
        options: [proposed, accepted, applied, rejected, held]
        default: proposed
      - { name: decided_by, label: Decided by (curator), widget: string, required: false }
      - {
          name: decided_on,
          label: Decided on,
          widget: datetime,
          type: date,
          format: YYYY-MM-DD,
          required: false,
        }
      - { name: curator_note, label: "Curator's note (never shown)", widget: text, required: false }
      - name: original_text
        label: The words it replaced (set when applied)
        widget: text
        required: false
      - &source
        name: source
        label: Where mw found it
        hint: Written by mw. Leave as is.
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: url, label: URL, widget: string, required: false }
          - { name: file, label: File, widget: string, required: false }
          - { name: file_url, label: File URL, widget: string, required: false }
          - { name: page, label: Page, widget: number, value_type: int, required: false }
          - { name: model, label: Model, widget: string, required: false }
          - { name: extracted_at, label: Extracted at, widget: string, required: false }
          - { name: input_hash, label: Input hash, widget: string, required: false }
          - { name: tool, label: Tool, widget: string, required: false }

  # ── The model ──

  - name: records
    label: Records
    label_singular: Record
    description: >-
      The objects: one file per image or document. A pulled record starts unverified, its caption
      and credit verbatim or empty, never invented. A status changes only with a dated note.
    folder: src/model/records
    format: json
    extension: json
    publish_mode: simple
    identifier_field: id
    slug: { template: "{{fields.id}}", editable: false }
    summary: "{{fields.id}} · {{fields.kind}} · {{fields.status}} · {{fields.title | truncate(50)}}"
    view_groups:
      - { label: Kind, field: kind }
      - { label: Status, field: status }
    delete: false
    fields:
      - name: id
        label: ID
        hint: Lowercase letters, digits and hyphens. Frozen at first publish.
        widget: string
        pattern: ["^[a-z0-9-]+$", "Lowercase letters, digits and hyphens"]
      - { name: kind, label: Kind, widget: select, options: [image, document, object, log] }
      - { name: title, label: Title, widget: string }
      - { name: caption, label: Caption (verbatim), widget: text, required: false }
      - { name: credit, label: Credit (verbatim), widget: string, required: false }
      - { name: alt, label: Alt text (verbatim), widget: text, required: false }
      - name: found_in
        label: Found in
        hint: The record (a page, a PDF) it was found in.
        widget: select
        options: "@records"
        required: false
      - { name: position, label: Position there, widget: number, value_type: int, required: false }
      - { name: follows, label: Follows passage, widget: string, required: false }
      - name: passages
        label: Passages
        hint: The text, as extracted. Changed only by a correction.
        widget: list
        required: false
        summary: "{{fields.id}} · {{fields.text | truncate(60)}}"
        fields:
          - { name: id, label: ID, widget: string }
          - { name: text, label: Text, widget: text }
      - { name: rights_holder, label: Rights holder, widget: string, default: unknown }
      - { name: held, label: The museum holds a copy, widget: boolean, default: false }
      - name: status
        label: Status
        widget: select
        options: [verified, unverified, not-held]
        default: unverified
      - name: media
        label: Files held
        hint: Repository paths (public/images/uploads/r-0001.jpg).
        widget: list
        required: false
        field: { name: path, label: Path, widget: string }
      - *source
      - &notes
        name: notes
        label: Notes
        hint: Dated lines in its history. A status changes only with one.
        widget: list
        required: false
        summary: "{{fields.date}} · {{fields.note | truncate(60)}}"
        fields:
          - {
              name: date,
              label: Date,
              widget: datetime,
              type: date,
              format: YYYY-MM-DD,
              default: "{{now}}",
            }
          - { name: note, label: Note, widget: text }

  - name: entities
    label: Entities
    label_singular: Entity
    description: >-
      People, families, places, organizations and events: each anchored by a record that spells its
      name. A name kept from the queue lands here, and only with an anchor.
    folder: src/model/entities
    format: json
    extension: json
    publish_mode: simple
    identifier_field: label
    slug: { template: "{{fields.slug}}", editable: false }
    summary: "{{fields.label}} · {{fields.kind}}"
    view_groups:
      - { label: Kind, field: kind }
    delete: false
    fields:
      - {
          name: kind,
          label: Kind,
          widget: select,
          options: [person, family, place, organization, event],
        }
      - name: id
        label: ID
        hint: Eight hex characters, never reused, frozen at first publish.
        widget: string
        pattern: ["^[0-9a-f]{8}$", "Eight hex characters, like 74af1d62"]
      - name: slug
        label: Slug
        hint: For the address. Also the file's name.
        widget: string
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase words joined by hyphens"]
      - { name: label, label: Name as shown, widget: string }
      - name: aliases
        label: Also named
        hint: Every other name, written exactly as each source writes it.
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { name: name, label: Name, widget: string }
          - {
              name: sources,
              label: Written so in,
              widget: select,
              options: "@records",
              multiple: true,
            }
      - name: anchors
        label: Anchored by
        hint: The records that spell its name. At least one.
        widget: select
        options: "@records"
        multiple: true
        min: 1
      - *notes

  - name: questions
    label: Open questions
    label_singular: Open question
    description: >-
      Bounded questions. One closes only on evidence; none is deleted. Opened by a person.
    folder: src/model/questions
    format: json
    extension: json
    publish_mode: simple
    identifier_field: id
    slug: { template: "{{fields.id}}", editable: false }
    summary: "{{fields.title}} · {{fields.status}}"
    delete: false
    fields:
      - {
          name: id,
          label: ID,
          hint: Lowercase words joined by hyphens. Frozen at first publish.,
          widget: string,
          pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase words joined by hyphens"],
        }
      - { name: title, label: Title, widget: string }
      - { name: what_we_know, label: What we know, widget: text }
      - { name: what_we_dont, label: "What we don't", widget: text }
      - { name: what_might_answer_it, label: What might answer it, widget: text }
      - { name: evidence_needed, label: Evidence needed, widget: text }
      - {
          name: last_known_source,
          label: Rests on,
          widget: select,
          options: "@records",
          multiple: true,
        }
      - {
          name: entities,
          label: Concerns,
          widget: select,
          options: "@entities",
          multiple: true,
          required: false,
        }
      - { name: status, label: Status, widget: select, options: [open, answered], default: open }
      - name: evidence
        label: Evidence
        hint: Every contradiction must be carried here. An answered question needs some.
        widget: select
        options: "@evidence"
        multiple: true
        required: false
      - { name: curator, label: Curator, widget: string, default: "{{author-login}}" }
      - {
          name: date,
          label: Date,
          widget: datetime,
          type: date,
          format: YYYY-MM-DD,
          default: "{{now}}",
        }
      - { name: from_proposal, label: Kept from (proposal), widget: hidden, required: false }

  - name: both_stand
    label: Both Stand
    label_singular: Both Stand entry
    description: >-
      Disagreements standing: two claims, each cited word for word, neither resolved by the museum.
      Settled only with a note saying how.
    folder: src/model/both-stand
    format: json
    extension: json
    publish_mode: simple
    identifier_field: id
    slug: { template: "{{fields.id}}", editable: false }
    summary: "{{fields.title}} · {{fields.status}}"
    delete: false
    fields:
      - {
          name: id,
          label: ID,
          widget: string,
          pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase words joined by hyphens"],
        }
      - { name: title, label: Title, widget: string }
      - name: claim_a
        label: One claim
        widget: object
        fields:
          - { name: span, label: Span, widget: select, options: "@text" }
          - { name: quote, label: Its words, widget: text }
      - name: claim_b
        label: The other
        widget: object
        fields:
          - { name: span, label: Span, widget: select, options: "@text" }
          - { name: quote, label: Its words, widget: text }
      - { name: status, label: Status, widget: select, options: [standing, settled], default: standing }
      - { name: settled_note, label: How it was settled, widget: text, required: false }
      - { name: opened_by, label: Opened by, widget: string, default: "{{author-login}}" }
      - { name: opened_on, label: Opened on, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: from_proposal, label: Kept from (proposal), widget: hidden, required: false }

  - name: links
    label: Links
    label_singular: Link
    description: Quiet doors between records ("Also"), each basis cited on both sides.
    file: src/model/links.json
    publish_mode: simple
    identifier_field: id
    summary: "{{fields.id}} · {{fields.from}} → {{fields.to}} · {{fields.basis}}"
    delete: false
    fields:
      - { name: id, label: ID, widget: string, pattern: ["^ln-\\d{3,}$", "Like ln-001"] }
      - { name: from, label: From, widget: select, options: "@records" }
      - { name: to, label: To, widget: select, options: "@records" }
      - { name: basis, label: What they share, widget: select, options: [shared name, shared place, shared date] }
      - name: cites
        label: Where each side says so
        widget: list
        fields:
          - { name: span, label: Span, widget: select, options: "@text" }
          - { name: quote, label: Quote, widget: text }
      - { name: curator, widget: hidden, default: "{{author-login}}" }
      - { name: date, label: Linked on, widget: datetime, type: date, format: YYYY-MM-DD, default: "{{now}}" }
      - { name: from_proposal, label: Kept from (proposal), widget: hidden, required: false }

  - name: evidence
    label: Evidence
    label_singular: Evidence link
    description: >-
      Claims linked to records: supports, contradicts or qualifies. A link is a curator's act. The
      quote is verbatim from its span; every contradiction must be carried by an open question.
    file: src/model/evidence.json
    publish_mode: simple
    identifier_field: id
    summary: "{{fields.id}} · {{fields.type}} · {{fields.record}}"
    delete: false
    fields:
      - {
          name: id,
          label: ID,
          hint: The next free number (ev-001). Frozen.,
          widget: string,
          pattern: ["^ev-\\d{3}$", "Like ev-001"],
        }
      - name: claim
        label: Claim
        hint: The span (record#passage or plate:record) and its words, verbatim.
        widget: object
        fields:
          - { name: span, label: Span, widget: select, options: "@text" }
          - { name: quote, label: Quote, widget: text }
      - { name: record, label: Record, widget: select, options: "@records" }
      - {
          name: type,
          label: Bears on it how,
          widget: select,
          options: [supports, contradicts, qualifies],
        }
      - { name: note, label: What it says, widget: text, required: false }
      - { name: curator, widget: hidden, default: "{{author-login}}" }
      - {
          name: date,
          label: Linked on,
          widget: datetime,
          type: date,
          format: YYYY-MM-DD,
          default: "{{now}}",
        }
